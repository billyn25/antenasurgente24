name: Validar web y directorio municipal
on:
  push:
    branches: [main, entrega-completa-20261014]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Comprobar que los previews siguen fuera de Google
        run: npm run check && node scripts/audit-indexing.mjs
      - name: Generar y auditar la publicación en el dominio definitivo
        run: npm run check && node scripts/audit-indexing.mjs --production
        env:
          CONTEXT: production
          URL: https://antenistaurgente24horas.com
          DEPLOY_PRIME_URL: https://main--antenistaurgente24horas.netlify.app
      - name: Instalar navegador de pruebas (solo CI)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Comprobar móvil, distritos, buscador y WhatsApp
        run: npm run test:browser
      - name: Verificar .com, 21 sitemaps e indexación en Netlify
        if: github.ref == 'refs/heads/main'
        run: node tests/publication-live.mjs
      - name: Verificar teléfonos del pie publicados, móvil y sin JavaScript
        if: github.ref == 'refs/heads/main'
        run: node tests/footer-contacts-live.mjs
      - name: Capturas y métricas del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-movil-y-madrid
          path: browser-artifacts/
          if-no-files-found: ignore
      - name: Resumen del directorio
        run: node -e "const r=JSON.parse(require('fs').readFileSync('dist/build-report.json')); delete r.pages; console.log(JSON.stringify(r,null,2))"
